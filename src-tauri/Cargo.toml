[package]
name = "orca-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Orca GUI — Tauri-based desktop app"

[lib]
name = "orca_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "orca-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orca-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream.workspace = true
urlencoding.workspace = true
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23"
open = "5"
url = "2"
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Replaces the deprecated `cocoa`/`objc` crates, which are now unmaintained and
# emit deprecation warnings for every constant used. Features are listed
# explicitly (default-features off) to match the subset tauri itself enables.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSObject",
] }
