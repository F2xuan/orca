name: Package orca-daemon

# Two ways to run this:
#
#   * Actions tab -> "Package orca-daemon" -> Run workflow  (manual, no tag needed)
#   * push a v* tag                                          (also attaches to the Release)
#
# Manual dispatch is the recommended path in a fork: pushing a tag additionally
# fires `release.yml`, which builds the *desktop app* and needs Apple/Tauri
# signing secrets that a fork does not have. Building only the daemon avoids it.
on:
  workflow_dispatch:
    inputs:
      build_deb:
        description: 'Also build the .deb package'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Read at job level so the Cloudsmith step can test it in an `if:` — the
    # `secrets` context is not reliably available in step-level `if:` conditions,
    # but `env` is.
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
    strategy:
      # One architecture failing must not cancel the other.
      fail-fast: false
      matrix:
        # Every entry builds for its OWN architecture on a native runner. That is
        # deliberate: musl targets cannot be produced with the distro's
        # `gcc-<arch>-linux-gnu` cross compiler (it links glibc), and pulling a
        # separate musl cross toolchain is fragile. Building natively means
        # `musl-tools` alone is enough, for both architectures.
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            deb_arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            deb_arch: arm64
            # Public repositories get free arm64 runners; no cross toolchain needed.
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # NOTE: the toolchain must come from here, never from a committed
      # `rust-toolchain.toml`. A pin in the repo overrides this action, so the
      # target is installed into `stable` while cargo resolves to the pinned
      # version instead — which then cannot find `core`, on aarch64 only
      # (x86_64-unknown-linux-gnu is the host target and exists everywhere).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-cargo-

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          musl-gcc --version

      - name: Build orca-daemon (static musl)
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          UPPER=$(echo "$TARGET" | tr 'a-z-' 'A-Z_')
          LOWER=$(echo "$TARGET" | tr '-' '_')
          # Target-scoped on purpose: host build-scripts (proc-macros, codegen)
          # must keep using the default gcc. Only C code compiled FOR the target
          # — vendored openssl, ring — goes through musl-gcc.
          export "CARGO_TARGET_${UPPER}_LINKER=musl-gcc"
          export "CC_${LOWER}=musl-gcc"
          export "AR_${LOWER}=ar"
          echo "building $TARGET (static musl) with musl-gcc"
          cargo build --release --locked --target "$TARGET" --bin orca-daemon --bin orca
        env:
          CARGO_TERM_COLOR: always

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "daemon version: $VERSION"

      - name: Stage binaries
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/orca-daemon" "dist/orca-daemon-linux-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/orca"        "dist/orca-linux-${{ matrix.arch }}"
          chmod 755 dist/orca-daemon-linux-${{ matrix.arch }} dist/orca-linux-${{ matrix.arch }}

      # Static linking is the whole point of the musl targets, and it is the one
      # property that silently regresses: the build still succeeds if the linker
      # falls back to dynamic linking, and the binary then fails on a host whose
      # glibc/musl differs. So assert it instead of assuming it.
      - name: Assert statically linked
        run: |
          set -euo pipefail
          for bin in dist/orca-daemon-linux-${{ matrix.arch }} dist/orca-linux-${{ matrix.arch }}; do
            echo "--- $bin"
            file "$bin"
            if ! file "$bin" | grep -q "statically linked"; then
              echo "::error::$bin is NOT statically linked"
              exit 1
            fi
            # `ldd` on a static binary reports "not a dynamic executable".
            ldd "$bin" 2>&1 || true
          done
          echo "both binaries are statically linked"

      - name: Build .deb package
        if: github.event_name == 'push' || inputs.build_deb
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PKG_DIR="orca-daemon_${VERSION}_${{ matrix.deb_arch }}"

          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/local/bin"
          mkdir -p "$PKG_DIR/etc/systemd/system"
          mkdir -p "$PKG_DIR/etc/orca"

          cat > "$PKG_DIR/DEBIAN/control" << EOF
          Package: orca-daemon
          Version: ${VERSION}
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: Edvin Syse <edvin@edvin.dev>
          Description: Orca Container Management Daemon
           REST API daemon for managing Docker containers, images, volumes,
           networks, and Kubernetes. Part of Orca Desktop.
          Homepage: https://orca-desktop.com
          Section: admin
          Priority: optional
          Depends: docker.io | docker-ce | podman
          EOF

          cat > "$PKG_DIR/DEBIAN/postinst" << 'EOF'
          #!/bin/bash
          set -e

          # Generate API token if not exists
          if [ ! -f /etc/orca/config.json ]; then
              TOKEN=$(openssl rand -hex 32)
              echo "{\"api_token\": \"$TOKEN\"}" > /etc/orca/config.json
              chmod 600 /etc/orca/config.json
              echo "Orca: Generated API token in /etc/orca/config.json"
          fi

          systemctl daemon-reload
          systemctl enable orca-daemon
          systemctl restart orca-daemon || systemctl start orca-daemon || true

          TOKEN=$(grep -o '"api_token"[[:space:]]*:[[:space:]]*"[^"]*"' /etc/orca/config.json | cut -d'"' -f4)
          IP=$(hostname -I 2>/dev/null | awk '{print $1}' || echo "YOUR_IP")
          echo ""
          echo "=== Orca Daemon Ready ==="
          echo "URL:   http://$IP:9477/api/v1"
          echo "Token: $TOKEN"
          echo ""
          echo "Add this host in Orca Desktop -> Settings -> Remote Hosts"
          EOF
          chmod 755 "$PKG_DIR/DEBIAN/postinst"

          cat > "$PKG_DIR/DEBIAN/prerm" << 'EOF'
          #!/bin/bash
          set -e
          systemctl stop orca-daemon 2>/dev/null || true
          systemctl disable orca-daemon 2>/dev/null || true
          EOF
          chmod 755 "$PKG_DIR/DEBIAN/prerm"

          cp "target/${{ matrix.target }}/release/orca-daemon" "$PKG_DIR/usr/local/bin/"
          cp "target/${{ matrix.target }}/release/orca"        "$PKG_DIR/usr/local/bin/"
          chmod 755 "$PKG_DIR/usr/local/bin/orca-daemon"
          chmod 755 "$PKG_DIR/usr/local/bin/orca"

          cp deploy/orca-daemon.service "$PKG_DIR/etc/systemd/system/"

          dpkg-deb --build "$PKG_DIR"
          cp "${PKG_DIR}.deb" dist/
          echo "Built: ${PKG_DIR}.deb"

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The reason this workflow is usable in a fork: the binaries are attached
      # to the run itself, so no Release, no Cloudsmith account, and no secrets
      # are required to get a downloadable artifact.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orca-daemon-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload .deb to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != ''
        run: |
          pip install cloudsmith-cli
          VERSION=${{ steps.version.outputs.version }}
          DEB_FILE="orca-daemon_${VERSION}_${{ matrix.deb_arch }}.deb"
          cloudsmith push deb edvin/orca/any-distro/any-version "dist/$DEB_FILE" \
            --api-key "$CLOUDSMITH_API_KEY" \
            --republish

      # Only meaningful on a tag run, and only if the Release already exists
      # (`release.yml` creates it as a draft). `|| true` keeps a missing release
      # from turning a successful build red.
      - name: Attach binaries to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          gh release upload "v${VERSION}" \
            "dist/orca-daemon-linux-${{ matrix.arch }}" \
            "dist/orca-linux-${{ matrix.arch }}" \
            --repo "${{ github.repository }}" --clobber || true
